name: Mathematics surface audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build pinned cmark-gfm structural oracle
        run: |
          git clone --depth 1 --branch 0.29.0.gfm.13 https://github.com/github/cmark-gfm.git .math-surface-tools/cmark-gfm
          test "$(git -C .math-surface-tools/cmark-gfm rev-parse HEAD)" = "587a12bb54d95ac37241377e6ddc93ea0e45439b"
          cmake -S .math-surface-tools/cmark-gfm -B .math-surface-tools/cmark-gfm/build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMARK_TESTS=OFF -DCMARK_SHARED=OFF
          cmake --build .math-surface-tools/cmark-gfm/build --parallel 2

      - name: Run deterministic scanner and structure tests
        working-directory: .github/math-surface
        env:
          CMARK_GFM: ${{ github.workspace }}/.math-surface-tools/cmark-gfm/build/src/cmark-gfm
        run: python3 -m unittest -v test_math_surface.py

      - name: Enforce repaired-document GFM structural parity
        env:
          CMARK_GFM: ${{ github.workspace }}/.math-surface-tools/cmark-gfm/build/src/cmark-gfm
        run: |
          python3 .github/math-surface/validate_gfm_structure.py \
            .github/math-surface/fixtures/pre-repair-README.txt README.md \
            --cmark-gfm "$CMARK_GFM"
          python3 .github/math-surface/validate_gfm_structure.py \
            .github/math-surface/fixtures/pre-repair-model.txt docs/model.md \
            --cmark-gfm "$CMARK_GFM"

      - name: Generate reproducible findings
        run: |
          python3 .github/math-surface/math_surface.py audit . --format sarif --output math-surface.sarif --fail-on none
          python3 .github/math-surface/math_surface.py audit . --format markdown --output math-surface-audit.md --fail-on none
          python3 .github/math-surface/math_surface.py extract . --output math-fragments.json

      - name: Install pinned renderer validators
        working-directory: .github/math-surface
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate MathJax 4 and KaTeX
        id: renderer
        run: |
          set +e
          node .github/math-surface/validate_renderers.mjs math-fragments.json both > renderer-validation.json
          status=$?
          python3 - <<'PY'
          import json
          report = json.load(open("renderer-validation.json", encoding="utf-8"))
          for item in report["results"]:
              failures = [f"MathJax={item['mathjax']}", f"KaTeX={item['katex']}"]
              if any("FAIL:" in value for value in failures):
                  print(f"{item['path']}:{item['line']}: {'; '.join(failures)}")
          print(f"renderer failures={report['failures']} formulas={report['formulas']}")
          PY
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Retain audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: math-surface-audit
          path: |
            math-surface.sarif
            math-surface-audit.md
            math-fragments.json
            renderer-validation.json

      - name: Upload SARIF when supported
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: math-surface.sarif

      - name: Enforce high-confidence gate
        run: |
          python3 .github/math-surface/math_surface.py audit . --format json --output math-surface.json --fail-on error

      - name: Enforce dual-renderer gate
        run: test "${{ steps.renderer.outputs.exit_code }}" -eq 0

      - name: Install pinned Chromium
        working-directory: .github/math-surface
        run: npx playwright install --with-deps chromium

      - name: Generate or enforce visual regression
        id: visual
        working-directory: .github/math-surface
        env:
          MATH_FRAGMENTS: ../../math-fragments.json
        run: |
          if find . -path '*-snapshots/math-surface*.png' -print -quit | grep -q .; then
            echo 'mode=enforce' >> "$GITHUB_OUTPUT"
            npx playwright test --config=playwright.config.mjs
          else
            echo 'mode=baseline-candidate' >> "$GITHUB_OUTPUT"
            npx playwright test --config=playwright.config.mjs --update-snapshots
          fi

      - name: Retain visual baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: math-surface-visual-baseline
          path: .github/math-surface/**/*-snapshots/math-surface*.png
          if-no-files-found: error
